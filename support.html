<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support - GlobalSwift Logistics</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#0A2540;
  --accent:#FF6B35;
  --bg:#f4f7fb;
  --success:#22c55e;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:var(--bg);
  color:#333;
}

/* HERO */
.hero{
  height:45vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#fff;
  background:url("https://images.unsplash.com/photo-1521791136064-7986c2920216?auto=format&fit=crop&w=1600&q=80") center/cover no-repeat;
  position:relative;
}

.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,rgba(10,37,64,0.9),rgba(0,0,0,0.6));
}

.hero-content{
  position:relative;
  z-index:1;
}

.hero h1{
  font-size:2.5rem;
}

/* SECTION */
.section{
  padding:70px 8%;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

/* CARD */
.card{
  background:#fff;
  padding:25px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  transition:0.3s;
  cursor:pointer;
}

.card:hover{
  transform:translateY(-6px);
  background:#fff7f3;
}

/* FORM */
.form-box{
  background:#fff;
  padding:30px;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  max-width:900px;
  margin:40px auto;
}

input, select, textarea{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ddd;
  outline:none;
}

.btn{
  margin-top:15px;
  padding:12px 18px;
  background:var(--primary);
  color:#fff;
  border:none;
  border-radius:25px;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  background:var(--accent);
}

/* STATUS */
.status{
  background:#fff;
  padding:25px;
  border-radius:12px;
  max-width:900px;
  margin:30px auto;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.ticket{
  padding:15px;
  border-left:5px solid var(--accent);
  margin-bottom:10px;
  background:#f9fafb;
  border-radius:6px;
}

/* TOAST */
.toast{
  position:fixed;
  bottom:20px;
  right:20px;
  background:var(--primary);
  color:#fff;
  padding:12px 18px;
  border-radius:8px;
  opacity:0;
  transform:translateY(20px);
  transition:0.4s;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

/* FOOTER */
footer{
  background:var(--primary);
  color:#fff;
  text-align:center;
  padding:30px;
  margin-top:50px;
}

/* ANIMATION */
.fade{
  opacity:0;
  transform:translateY(30px);
  transition:0.6s;
}

.show{
  opacity:1;
  transform:translateY(0);
}

/* MOBILE */
@media(max-width:768px){
  .hero h1{font-size:2rem;}
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <h1 id="typing"></h1>
    <p>We’re here to help you 24/7 with your logistics needs.</p>
  </div>
</section>

<!-- SUPPORT OPTIONS -->
<section class="section">
<div class="grid">

  <div class="card">💬 Live Chat</div>
  <div class="card">📧 Email Support</div>
  <div class="card">📞 Call Center</div>

</div>
</section>

<!-- TICKET FORM -->
<section class="section">

<div class="form-box fade">

  <h2>Submit a Support Ticket</h2>

  <label for="issue-type">Issue Type</label>
  <select id="issue-type" title="Issue Type">
    <option value="">Select Issue Type</option>
    <option value="tracking">Tracking Issue</option>
    <option value="delivery">Delivery Delay</option>
    <option value="payment">Payment Problem</option>
  </select>

  <input placeholder="Full Name">
  <input placeholder="Email Address">

  <textarea rows="5" placeholder="Describe your issue..."></textarea>

  <button class="btn" onclick="submitTicket()">Submit Ticket</button>

</div>

<!-- STATUS -->
<div class="status fade">

  <h2>Your Tickets</h2>

  <div class="ticket">🎫 #GS12345 - In Progress</div>
  <div class="ticket">🎫 #GS54321 - Resolved</div>

</div>

</section>

<!-- TOAST -->
<div class="toast" id="toast">Ticket Submitted Successfully ✔</div>

<!-- FOOTER -->
<footer>
  <p>© 2026 GlobalSwift Support System</p>
</footer>

<script>

/* TYPING */
const text="Customer Support Portal";
let i=0;

function type(){
  if(i<text.length){
    document.getElementById("typing").innerHTML+=text.charAt(i);
    i++;
    setTimeout(type,70);
  }
}
type();

/* TOAST */
function submitTicket(){
  const toast=document.getElementById("toast");
  toast.classList.add("show");

  setTimeout(()=>{
    toast.classList.remove("show");
  },3000);
}

/* ANIMATION */
const fade=document.querySelectorAll(".fade");

const observer=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      e.target.classList.add("show");
    }
  });
},{threshold:0.2});

fade.forEach(f=>observer.observe(f));

</script>

</body>
</html>
