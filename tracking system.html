<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracking System - GlobalSwift Logistics</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#0A2540;
  --accent:#FF6B35;
  --bg:#f4f7fb;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:var(--bg);
  color:#333;
  overflow-x:hidden;
}

/* HERO */
.hero{
  height:55vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#fff;
  background:url("https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?auto=format&fit=crop&w=1600&q=80") center/cover no-repeat;
  position:relative;
}

.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,rgba(10,37,64,0.85),rgba(0,0,0,0.6));
}

.hero-content{
  position:relative;
  z-index:1;
}

.hero h1{
  font-size:2.8rem;
}

/* SEARCH BOX */
.search{
  text-align:center;
  margin:30px;
}

.search-box{
  width:60%;
  padding:15px;
  border-radius:10px;
  border:none;
  outline:none;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

/* SECTION */
.section{
  padding:80px 8%;
}

.section h2{
  text-align:center;
  margin-bottom:40px;
  color:var(--primary);
}

/* TRACK CARD */
.track-card{
  background:#fff;
  padding:25px;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  max-width:900px;
  margin:30px auto;
}

/* STATUS BAR */
.progress{
  height:10px;
  background:#eee;
  border-radius:10px;
  overflow:hidden;
  margin:20px 0;
}

.fill{
  height:100%;
  width:70%;
  background:var(--accent);
}

/* TIMELINE */
.timeline{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.step{
  padding:12px;
  border-left:4px solid var(--accent);
  background:#fafafa;
  border-radius:6px;
  transition:0.3s;
}

.step:hover{
  transform:translateX(5px);
}

/* ROUTE */
.route{
  margin-top:30px;
  text-align:center;
}

.line{
  height:4px;
  background:linear-gradient(90deg,#0A2540,#FF6B35,#0A2540);
  width:80%;
  margin:20px auto;
  border-radius:10px;
  position:relative;
}

.dot{
  width:12px;
  height:12px;
  background:#0A2540;
  border-radius:50%;
  position:absolute;
  top:-4px;
}

.dot.start{left:0;}
.dot.middle{left:50%;}
.dot.end{right:0;}

/* BUTTON */
.btn{
  display:inline-block;
  margin-top:15px;
  padding:10px 15px;
  background:var(--primary);
  color:#fff;
  border-radius:20px;
  text-decoration:none;
  cursor:pointer;
}

/* FOOTER */
footer{
  background:var(--primary);
  color:#fff;
  text-align:center;
  padding:30px;
  margin-top:50px;
}

/* ANIMATION */
.fade{
  opacity:0;
  transform:translateY(30px);
  transition:0.6s;
}

.show{
  opacity:1 !important;
  transform:translateY(0) !important;
}

/* MOBILE */
@media(max-width:768px){
  .search-box{width:90%;}
  .hero h1{font-size:2rem;}
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <h1 id="typing"></h1>
    <p>Track your shipment in real-time across the globe.</p>
  </div>
</section>

<!-- SEARCH -->
<div class="search">
  <input class="search-box" id="trackInput" placeholder="Enter Tracking ID (e.g GLS-2026-001)">
  <br>
  <button class="btn" onclick="track()">Track Shipment</button>
</div>

<!-- TRACK RESULT -->
<section class="section">

<div class="track-card fade" id="result">

  <h2>Shipment Status</h2>

  <p><strong>Status:</strong> In Transit</p>

  <div class="progress">
    <div class="fill"></div>
  </div>

  <div class="timeline">

    <div class="step">✔ Order Confirmed</div>
    <div class="step">✔ Package Dispatched</div>
    <div class="step">🚚 In Transit</div>
    <div class="step">⏳ Out for Delivery</div>
    <div class="step">📦 Delivered</div>

  </div>

  <div class="route">
    <h3>Route</h3>
    <div class="line">
      <div class="dot start"></div>
      <div class="dot middle"></div>
      <div class="dot end"></div>
    </div>
    <p>📍 Lagos → Abuja → London</p>
  </div>

</div>

</section>

<!-- FOOTER -->
<footer>
  <p>© 2026 GlobalSwift Tracking System</p>
</footer>

<script>

/* TYPING */
const text="Global Shipment Tracking System";
let i=0;

function type(){
  if(i<text.length){
    document.getElementById("typing").innerHTML+=text.charAt(i);
    i++;
    setTimeout(type,70);
  }
}
type();

/* FADE */
const el=document.getElementById("result");
const observer=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      e.target.classList.add("show");
    }
  });
},{threshold:0.2});

observer.observe(el);

/* TRACK FUNCTION (SIMULATED) */
function track(){
  let input=document.getElementById("trackInput").value;
  if(input.trim()!==""){
    alert("Tracking: "+input+" (Demo Mode)");
    el.scrollIntoView({behavior:"smooth"});
  }else{
    alert("Enter a valid tracking ID");
  }
}

</script>

</body>
</html>
